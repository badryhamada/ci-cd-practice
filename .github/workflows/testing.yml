name: testing
on: push
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: git code from github repo
        uses: actions/checkout@v7

      - name: install Node js
        uses: actions/setup-node@v7
        with: 
          node-version: 22 
        
      - name: install depandencies
        run: npm ci 

      - name : tests  
        run : npm test 

       
