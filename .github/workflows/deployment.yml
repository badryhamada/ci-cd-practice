name: deployment
on: push
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: git code from github repo
        uses: actions/checkout@v7

      - name: install Node js
        uses: actions/setup-node@v7
        with: 
          node-version: 22 
        
      - name: install depandencies
        run: npm ci 

      - name : tests  
        run : npm test 

  deploy: 
    needs : test # deploy dependent test (run first ) [ , , ,] more
    runs-on : ubuntu-latest 
    permissions:
      contents: read
      pages: write
      id-token: write
      
    steps:
      - name: git code from github repo
        uses: actions/checkout@v7

      - name: install Node js
        uses: actions/setup-node@v7
        with: 
          node-version: 22 
        
      - name: install depandencies
        run: npm ci 

      - name: Bulid Project
        run: npm run build
        
      - name: configure pages 
        uses: actions/configure-pages@v5 
        
      - name: upload pages artifact 
        uses: actions/upload-pages-artifact@v3  
        with:
          path: ./dist 

      - name : deploy to github pages 
        uses : actions/deploy-pages@v4 



      